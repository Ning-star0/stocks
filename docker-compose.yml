services:
  db:
    image: postgres:16-alpine
    container_name: stock-ai-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocks_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocks_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

